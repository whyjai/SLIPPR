# Tracks the NFL prop cheat sheet: freezes it before kickoff and grades it
# after the games, committing both to data/research/prop-sheets/ (the site's
# "How the sheet has done" box reads the track file).
name: Prop sheet tracking

on:
  schedule:
    - cron: '0 18 * * 4' # Thu 2pm ET: the week's sheet before Thursday night
    - cron: '0 12 * * 0' # Sun 8am ET: with the latest injury report (before London kickoffs)
    - cron: '0 13 * * 2' # Tue 9am ET: grade the week (nflverse posts Monday night's box scores overnight)
  workflow_dispatch:
    inputs:
      task:
        description: snapshot or track
        default: track

permissions:
  contents: write

concurrency:
  group: prop-sheet
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Snapshot or grade
        run: |
          # NFL season label: January-February games belong to the previous year.
          season=$(date -u +%Y); [ "$(date -u +%m)" -le 3 ] && season=$((season - 1))
          task="${{ github.event.inputs.task }}"
          if [ -z "$task" ]; then
            # Scheduled: Thursday and Sunday snapshot, Tuesday grades.
            [ "$(date -u +%u)" = "2" ] && task=track || task=snapshot
          fi
          npx tsx scripts/research/grade-nfl-sheet.mts "$task" "$season"
      - name: Commit
        run: |
          git config user.name "slippr-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/prop-sheets
          git diff --cached --quiet || { git commit -m "Prop sheet: ${{ github.event.inputs.task || 'scheduled' }} $(date -u +%F)"; git push; }
